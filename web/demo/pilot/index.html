<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Seyd pilot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%2312a37a%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27white%27/%3E%3C/svg%3E">
  <style>
    /* Page layout only; tokens, type and components come from @seyd/theme (docs/design.md).
       The chrome follows the theme; everything drawn over the picture uses the scrim tokens. */
    html, body { height: 100%; }
    #app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
    header, footer { display: flex; gap: 14px; align-items: center; padding: 8px 14px; background: var(--seyd-surface); }
    header { border-bottom: 1px solid var(--seyd-line); }
    footer { border-top: 1px solid var(--seyd-line); font-family: var(--seyd-font-mono); font-size: 11.5px; color: var(--seyd-muted); flex-wrap: wrap; }
    header .robot { font-family: var(--seyd-font-mono); font-size: 12.5px; color: var(--seyd-ink-2); }
    header .spacer { flex: 1; }
    header label { display: inline-flex; align-items: center; gap: 6px; font-family: var(--seyd-font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--seyd-muted); }
    main { position: relative; min-height: 0; background: #000; }
    seyd-video { width: 100%; height: 100%; }
    seyd-hud { position: absolute; top: 10px; left: 10px; }
    seyd-connect-error { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 24px); }
    .overlay { position: absolute; font-size: 12px; line-height: 1.4; padding: 4px 9px; border-radius: var(--seyd-radius-sm); background: var(--seyd-scrim); color: var(--seyd-on-scrim-2); }
    .notice { right: 10px; bottom: 10px; }
    .lan-hint { left: 10px; bottom: 10px; max-width: 520px; color: var(--seyd-amber); }
    footer #sensor { color: var(--seyd-accent); }
    footer .theme-switch { margin-left: auto; }
    @media (max-width: 640px) { .notice { display: none; } }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <a class="wordmark on-surface" href="../"><i></i>Seyd</a>
      <span id="robot" class="robot"></span>
      <span id="role" class="tag" hidden></span>
      <span class="spacer"></span>
      <label>QoS <select id="qos" class="small"><option value="latency">latency</option><option value="balanced">balanced</option><option value="quality">quality</option></select></label>
      <button id="takeoff-btn" class="small" type="button" title="Take off (keyboard: T)" hidden>take off</button>
      <button id="land-btn" class="small danger" type="button" title="Land now (keyboard: L)" hidden>land</button>
      <button id="hud-btn" class="small" type="button" title="Show or hide the stats HUD (keyboard: S)" aria-pressed="false">stats</button>
    </header>
    <main>
      <seyd-video id="video"></seyd-video>
      <seyd-hud id="hud"></seyd-hud>
      <seyd-connect-error id="err"></seyd-connect-error>
      <div class="overlay notice" id="notice">You are controlling a physical camera. Response latency reflects your connection.</div>
      <div class="overlay lan-hint" id="lan-hint" hidden></div>
    </main>
    <footer><span id="hint">SPACE — snapshot · S — stats</span><span id="sensor"></span><span id="pad"></span><span id="theme-switch"></span></footer>
  </div>
  <script type="module" src="../src/main.ts"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%2312a37a%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27white%27/%3E%3C/svg%3E">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seyd demo — live PTZ camera</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 14px/1.4 system-ui, sans-serif; }
    #app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
    header { display: flex; gap: 16px; align-items: center; padding: 8px 14px; background: #1b1b1b; }
    header .brand { font-weight: 700; letter-spacing: .04em; color: inherit; text-decoration: none; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #2a2a2a; color: #bbb; border: 1px solid #444; }
    .badge.driver { color: #7d7; border-color: #3a5; }
    .badge.observer { color: #111; background: #fb5; border-color: #fb5; font-weight: 700; }
    .lan-hint { position: absolute; left: 10px; bottom: 10px; max-width: 520px; font-size: 12px; color: #fc8; background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 4px; }
    header .spacer { flex: 1; }
    select, button.hud-btn { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 2px 6px; font: inherit; }
    button.hud-btn { cursor: pointer; padding: 2px 10px; }
    button.hud-btn[aria-pressed="true"] { background: #2e4a2e; border-color: #3a5; color: #7d7; }
    main { position: relative; min-height: 0; }
    seyd-video { width: 100%; height: 100%; }
    seyd-hud { position: absolute; top: 10px; left: 10px; }
    seyd-connect-error { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); }
    footer { padding: 6px 14px; background: #1b1b1b; color: #aaa; font-size: 12px; display: flex; gap: 16px; }
    footer #sensor { color: #7d7; }
    .notice { position: absolute; right: 10px; bottom: 10px; font-size: 12px; color: #bbb; background: rgba(0,0,0,.5); padding: 3px 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <a class="brand" href="../">SEYD</a>
      <span id="robot"></span>
      <span id="role" class="badge" hidden></span>
      <span class="spacer"></span>
      <label>QoS <select id="qos"><option value="latency">latency</option><option value="balanced">balanced</option><option value="quality">quality</option></select></label>
      <button id="hud-btn" class="hud-btn" type="button" title="Show or hide the stats HUD (keyboard: S)" aria-pressed="false">stats</button>
    </header>
    <main>
      <seyd-video id="video"></seyd-video>
      <seyd-hud id="hud"></seyd-hud>
      <seyd-connect-error id="err"></seyd-connect-error>
      <div class="notice">You are controlling a physical camera. Response latency reflects your connection.</div>
      <div class="lan-hint" id="lan-hint" hidden></div>
    </main>
    <footer><span id="hint">SPACE — snapshot · S — stats</span><span id="sensor"></span></footer>
  </div>
  <script type="module" src="../src/main.ts"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seyd demo — live PTZ camera</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 14px/1.4 system-ui, sans-serif; }
    #app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
    header { display: flex; gap: 16px; align-items: center; padding: 8px 14px; background: #1b1b1b; }
    header .brand { font-weight: 700; letter-spacing: .04em; }
    header .spacer { flex: 1; }
    select { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 2px 6px; }
    main { position: relative; min-height: 0; }
    seyd-video { width: 100%; height: 100%; }
    seyd-hud { position: absolute; top: 10px; left: 10px; }
    seyd-connect-error { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); }
    footer { padding: 6px 14px; background: #1b1b1b; color: #aaa; font-size: 12px; display: flex; gap: 16px; }
    footer #sensor { color: #7d7; }
    .notice { position: absolute; right: 10px; bottom: 10px; font-size: 12px; color: #bbb; background: rgba(0,0,0,.5); padding: 3px 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span class="brand">SEYD</span>
      <span id="robot"></span>
      <span class="spacer"></span>
      <label>QoS <select id="qos"><option value="latency">latency</option><option value="balanced">balanced</option><option value="quality">quality</option></select></label>
    </header>
    <main>
      <seyd-video id="video"></seyd-video>
      <seyd-hud id="hud"></seyd-hud>
      <seyd-connect-error id="err"></seyd-connect-error>
      <div class="notice">You are controlling a physical camera. Response latency reflects your connection.</div>
    </main>
    <footer><span id="hint">SPACE — snapshot · S — stats</span><span id="sensor"></span></footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

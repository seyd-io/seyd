language = "C"
header = """/* Copyright 2026 Anton Gravestam
 * SPDX-License-Identifier: Apache-2.0
 *
 * seyd.h — the Seyd C ABI (ADR 0004).
 *
 * GENERATED by cbindgen from packages/seyd-ffi; do not edit by hand.
 * Regenerate with `cargo build -p seyd-ffi`.
 *
 * Link against libseyd (cdylib or staticlib). Lifecycle:
 *   seyd_agent_create -> seyd_channel_add* -> seyd_agent_start
 *   -> seyd_push_frame / seyd_push_message
 *   -> seyd_agent_stop -> seyd_agent_destroy
 *
 * Callbacks arrive on one dedicated Seyd thread and must not block.
 */"""
include_guard = "SEYD_H"
cpp_compat = true
documentation = true
documentation_style = "doxy"
line_length = 88
tab_width = 4
usize_is_size_t = true

[export]
prefix = ""
include = ["seyd_status", "seyd_channel_kind", "seyd_role", "seyd_signal_state"]

[export.rename]
"seyd_counters_t" = "seyd_counters_t"

[enum]
prefix_with_name = false
rename_variants = "None"

[parse]
parse_deps = false

[defines]

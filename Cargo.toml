[workspace]
resolver = "2"
members = [
    "packages/seyd-fec",
    "packages/seyd-wire",
    "packages/seyd-qos",
    "packages/seyd-nat",
    "packages/seyd-transport",
    "packages/seyd-signal-client",
    "packages/seyd-core",
    "packages/seyd-ffi",
    "packages/seydd",
    "packages/seyd-prober",
    # Customer-style programs that host seyd-core directly (examples/, not Seyd).
    "examples/tello-robot/host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"
repository = "https://github.com/seyd-io/seyd"

[workspace.dependencies]
seyd-fec = { path = "packages/seyd-fec" }
seyd-wire = { path = "packages/seyd-wire" }
seyd-qos = { path = "packages/seyd-qos" }
seyd-nat = { path = "packages/seyd-nat" }
seyd-transport = { path = "packages/seyd-transport" }
seyd-signal-client = { path = "packages/seyd-signal-client" }
seyd-core = { path = "packages/seyd-core" }
seyd-ffi = { path = "packages/seyd-ffi" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
bytes = "1"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
sha2 = "0.10"
hex = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
h3-webtransport = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

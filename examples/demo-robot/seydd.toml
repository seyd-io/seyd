# Seyd demo robot — Hikvision PTZ camera (DEMO.md). Nothing in this file is
# vendor-specific; the Hikvision driver is examples/demo-robot/bridge.py,
# which consumes the generic UDP interfaces declared here.
[agent]
robot_id        = "seyd-demo"
signal_url      = "wss://seyd-signal-flj7s44j4a-ew.a.run.app/ws"
credential_path = "examples/demo-robot/.robot.key"
qos_profile     = "balanced"
max_sessions    = 4

[[channel]]
kind  = "video"
name  = "main"
# Baseline level 3.1 admits 1280x720, the highest rung below. Credentials for
# every layer come from SEYD_RTSP_USER / SEYD_RTSP_PASSWORD.
codec = "avc1.42001f"
fps   = 25

# Simulcast (ADR 0008): the camera already encodes both streams, so the agent
# picks which one to relay instead of reconfiguring one and reconnecting.
# Provision the camera to match with examples/demo-robot/setup-simulcast.py.
# Same frame rate on both rungs on purpose — resolution is what degrades.

  [[channel.layer]]
  name  = "low"                                              # 640x480, sub stream
  input = "rtsp://192.168.86.237:554/Streaming/Channels/102"

  [[channel.layer]]
  name  = "high"                                             # 1280x720, main stream
  input = "rtsp://192.168.86.237:554/Streaming/Channels/101"
  activate_above_kbps = 1800

[[channel]]
kind   = "command"
name   = "ptz"
output = "udp://127.0.0.1:5004"
codec  = "json"

[publisher_control]
udp = "127.0.0.1:5003"

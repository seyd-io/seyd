name: rust
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: FEC interop vectors (Python reference → Rust)
        run: python3 tools/fec-vectors.py | cargo run -q -p seyd-fec --example check
      - name: FEC interop vectors (Python reference → JS)
        run: python3 tools/fec-vectors.py | node tools/fec-check.js
      - name: seyd.h is up to date with seyd-ffi
        # build.rs regenerates it; a diff means someone edited the header by
        # hand or changed the ABI without committing the regenerated file.
        run: git diff --exit-code sdks/c/include/seyd.h
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every source file carries its license header
        run: python3 tools/check-headers.py
      - name: Dependency licenses within deny.toml
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
  # The core on Windows: the same clippy and tests as Linux, on the msvc
  # toolchain a Windows robot would build with. Linux is the only place the
  # FEC vectors and the header check run; they do not depend on the OS.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  sdks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Windows has no make or gcc of its own; the C examples build in an MSYS2
      # shell with MinGW gcc against the msvc-built seyd.dll, which is how a
      # GNU-toolchain integrator on Windows would do it.
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: C ABI conformance
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
        run: make -C sdks/c check
      - name: Python SDK
        run: |
          python -m pip install --upgrade pip cffi pytest
          python -m pytest sdks/python/tests -q
  cross-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cross --locked
      - run: cross build --workspace --release --target aarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@v7
        with:
          name: seydd-aarch64-unknown-linux-gnu
          path: target/aarch64-unknown-linux-gnu/release/seydd

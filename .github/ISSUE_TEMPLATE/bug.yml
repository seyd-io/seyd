name: Bug
description: Something in the agent, an SDK, the web pilot or the docs behaves wrongly
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The form factor and version. `seydd --version`, `seyd_version()`, `seyd.ABI_VERSION`, the `@seyd/web` commit.
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The config or the calls, the encoder, and the network between robot and pilot. Redact credentials and RTSP userinfo.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Robot log lines (`RUST_LOG=info`), the HUD (`S`) or a `seyd-smoke.py --record` file, browser console errors.
      render: text
